<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ド派手インベーダーゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🌟 ド派手インベーダーゲーム 🌟</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="label">スコア</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item high-score">
                    <span class="label">🏆 ハイスコア</span>
                    <span id="highScore" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">❤️ 残機</span>
                    <span id="lives" class="value">3</span>
                </div>
                <div class="score-item">
                    <span class="label">⭐ レベル</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <p>← → キーで移動 | スペースキーで発射（長押し連射可能）</p>
            <div class="powerup-guide">
                <span class="powerup-item triple">3WAY</span>
                <span class="powerup-item rapid">連射</span>
                <span class="powerup-item speed">加速</span>
                <span class="powerup-item shield">シールド</span>
                <span class="powerup-item bonus">BONUS</span>
                <span class="powerup-item bomb">BOMB</span>
            </div>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>💥 ゲームオーバー！ 💥</h2>
            <div class="final-scores">
                <p>最終スコア: <span id="finalScore" class="final-value">0</span></p>
                <p>ハイスコア: <span id="finalHighScore" class="final-value">0</span></p>
            </div>
            <button id="restartBtn">🔄 もう一度プレイ</button>
        </div>
        <div id="startScreen" class="start-screen">
            <h2>🚀 ド派手インベーダーゲーム 🚀</h2>
            <div class="start-info">
                <p class="feature">✨ パワーアップをゲットして強化！</p>
                <p class="feature">💥 コンボを繋げて高得点！</p>
                <p class="feature">👾 5レベルごとにボス出現！</p>
                <p class="feature">🛸 UFOを撃墜でボーナス！</p>
            </div>
            <p class="start-prompt">スペースキーでスタート</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
